<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Elian Echavarria - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#160709"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8232A"/>
      <stop offset="45%" stop-color="#FFD84D"/>
      <stop offset="55%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#E8232A"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#E8232A"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8232A" stop-opacity="0"/>
      <stop offset="70%" stop-color="#F5C518" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF3B0" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <!-- pulsing crimson aura behind the bolt -->
  <ellipse cx="150" cy="140" rx="130" ry="110" fill="#E8232A" opacity="0.10">
    <animate attributeName="opacity" values="0.06;0.22;0.06" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="120;145;120" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- speed trails racing across -->
  <g>
    <rect x="1000" y="46" width="180" height="3" rx="1.5" fill="url(#trail)">
      <animate attributeName="x" values="1000;-220" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="1000" y="88" width="120" height="2" rx="1" fill="url(#trail)" opacity="0.75">
      <animate attributeName="x" values="1000;-220" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="1000" y="152" width="220" height="3" rx="1.5" fill="url(#trail)" opacity="0.6">
      <animate attributeName="x" values="1000;-260" dur="1.8s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <rect x="1000" y="206" width="150" height="2" rx="1" fill="url(#trail)" opacity="0.8">
      <animate attributeName="x" values="1000;-220" dur="1.3s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="1000" y="242" width="200" height="2" rx="1" fill="url(#trail)" opacity="0.5">
      <animate attributeName="x" values="1000;-260" dur="2.6s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>

  <!-- main lightning bolt, flickering -->
  <g filter="url(#glow)" transform="translate(96,52)">
    <path d="M 62 0 L 8 92 L 46 92 L 20 176 L 108 68 L 68 68 L 104 0 Z"
          fill="url(#boltGrad)" stroke="#FFF3B0" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.55;1;0.8;1" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate"
                      values="96 52; 99 52; 96 52; 94 52; 96 52" dur="0.35s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- small arc sparks -->
  <g stroke="#FFD84D" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#softglow)">
    <path d="M 236 96 l 22 -14 l -8 20 l 24 -10">
      <animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M 230 190 l 26 12 l -10 -20 l 22 6">
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite" begin="1.1s"/>
    </path>
  </g>

  <!-- name + role -->
  <text x="320" y="118" font-family="Verdana,DejaVu Sans,sans-serif" font-size="52" font-weight="bold"
        fill="url(#shine)" filter="url(#softglow)">ELIAN ECHAVARRIA</text>

  <text x="322" y="160" font-family="Consolas,Courier New,monospace" font-size="22" fill="#C9D1D9">
    Front-End Developer
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="322" y="196" font-family="Consolas,Courier New,monospace" font-size="16" fill="#8B949E">
    Bronx, NY  •  HTML  •  CSS  •  JavaScript  •  TypeScript  •  PERN  •  Tailwind CSS 
  </text>

  <!-- animated underline that shoots out -->
  <rect x="322" y="214" width="0" height="4" rx="2" fill="url(#shine)">
    <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- top + bottom energy rails -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#shine)" opacity="0.9"/>
  <rect x="0" y="276" width="1000" height="4" fill="url(#shine)" opacity="0.9"/>
</svg>
